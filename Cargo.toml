[package]
name = "voicemeeter-auto-restart"
version = "1.0.0"
edition = "2021"
description = "High-performance Voicemeeter watchdog service with modern Slint Material Design 3 GUI"

[dependencies]
slint = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rfd = "0.15"
thiserror = "2.0"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
slint-build = "1.9"
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
